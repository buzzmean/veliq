name: Platega one-off contracts
on:
  pull_request:
    paths: ['services/control-plane/**', 'website/assets/account.js', 'website/assets/pricing-policy*', 'deploy/vps/plans.platega.json', 'tests/frontend/payment_smoke.py', '.github/workflows/platega-one-off.yml']
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payment_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: payments
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U payment_test -d payments" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      NEEXITLAG_TEST_DATABASE_URL: postgres://payment_test:isolated-ci-only@127.0.0.1:5432/payments?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - run: go test -race -count=1 -timeout=180s ./services/control-plane
      - run: go vet ./services/control-plane/...
      - run: go build ./services/control-plane/...
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/frontend/payment_smoke.py
