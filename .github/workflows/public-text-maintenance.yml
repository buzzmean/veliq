name: Исправление кодировки старых описаний
on:
  push:
    branches: [docs/public-text-polish-20261124]
    paths: [.github/workflows/public-text-maintenance.yml]
permissions:
  contents: write
jobs:
  descriptions:
    name: Три проверенные строки описаний
    if: github.repository == 'buzzmean/veliq'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Исправить текст и проверить неизменность релизов
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          
          base = "https://api.github.com/repos/buzzmean/veliq/releases/"
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          changes = [
            {
              "id": 423617066,
              "tag": "v0.3.577",
              "before_sha256": "766f1c203ed5ee3d41b762cfafa80d4eb5942fb9882b7e01e29be33530be65dd",
              "body": "Сборка 577 (d7a2419ea90f)."
            },
            {
              "id": 423589461,
              "tag": "v0.3.575",
              "before_sha256": "0932e97bbe6567d1806a8cb835656abd1f6122bfa76c9366f47a2c0cdba5ba3a",
              "body": "Сборка 575 (30be3325dc0b)."
            },
            {
              "id": 423574920,
              "tag": "v0.3.560",
              "before_sha256": "7aa4f549190d1f81fcf12223b43bbfa28f816e5cb18885a36629fac170373a41",
              "body": "Сборка 560 (dbfbea5cf23b)."
            }
          ]
          
          def request(release_id, data=None):
              body = None if data is None else json.dumps(data, ensure_ascii=False).encode()
              req = urllib.request.Request(base + str(release_id), data=body, headers=headers, method="GET" if data is None else "PATCH")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          
          def files(release):
              return [(a["id"], a["name"], a["size"], a.get("digest")) for a in release["assets"]]
          
          for item in changes:
              before = request(item["id"])
              assert before["tag_name"] == item["tag"] and not before["draft"] and not before["prerelease"]
              if before["body"] != item["body"]:
                  digest = hashlib.sha256(before["body"].encode()).hexdigest()
                  assert digest == item["before_sha256"], "Описание изменилось после проверки"
                  request(item["id"], {"body": item["body"]})
              after = request(item["id"])
              assert after["body"] == item["body"]
              assert files(after) == files(before), "Состав файлов изменился"
              for key in ("tag_name", "target_commitish", "draft", "prerelease", "published_at"):
                  assert after[key] == before[key], key
              print(item["tag"] + ": описание проверено, состав файлов сохранён")
          PY
