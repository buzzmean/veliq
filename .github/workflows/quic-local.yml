name: QUIC and HTTP3 owned probe
on:
  push:
    branches: [main, 'feat/r1-quic-*']
    paths:
      - 'core/localstrategy/**'
      - 'core/browserproxy/**'
      - 'platform/windows/**'
      - '.github/workflows/quic-local.yml'
  pull_request:
    paths:
      - 'core/localstrategy/**'
      - 'core/browserproxy/**'
      - 'platform/windows/**'
      - '.github/workflows/quic-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - name: Compile every filter with the pinned WinDivert DLL
        shell: powershell
        run: |
          New-Item bin -ItemType Directory -Force | Out-Null
          & go test ./platform/windows '-run' '^TestServiceWinDivertFilterInventory$'
          if ($LASTEXITCODE) { throw 'FILTER_INVENTORY_FAILED' }
          & go test -c -o bin/filter-tests.exe ./platform/windows
          if ($LASTEXITCODE) { throw 'FILTER_TEST_BUILD_FAILED' }
          & ./tools/windows/test-windivert-filters.ps1 -TestExecutable (Join-Path $PWD 'bin/filter-tests.exe')
      - name: Owned HTTP3, passive origin, native BLOCK and QUIC bounds
        run: go test -race -v ./core/localstrategy ./core/browserproxy ./platform/windows -run 'QUICProbe|HTTP3Probe|QUICOrigin' -count 1 -timeout 90s
      - name: Bounded QUIC Initial and ClientHello fuzzing
        shell: powershell
        run: |
          & go test ./core/localstrategy '-run' '^$' '-fuzz' '^FuzzQUICOriginInitial$' '-fuzztime' '10000x' '-fuzzminimizetime' '1000x' '-parallel' '2' '-timeout' '90s'
          if ($LASTEXITCODE) { throw 'QUIC_INITIAL_FUZZ_FAILED' }
          & go test ./core/localstrategy '-run' '^$' '-fuzz' '^FuzzQUICOriginHello$' '-fuzztime' '10000x' '-fuzzminimizetime' '1000x' '-parallel' '2' '-timeout' '90s'
          if ($LASTEXITCODE) { throw 'QUIC_HELLO_FUZZ_FAILED' }
      - name: Full Windows Go race regressions
        run: go test -race -p 1 -timeout 180s ./...
      - run: go vet ./...
      - run: go build ./...
# Linux race/vet/build with PostgreSQL runs in relay-release.yml at the same SHA.
# HTTP3 uses a real connected socket with a loopback destination seam.
# No browser, driver install or public ISP acceptance.
