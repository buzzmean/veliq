name: Release 690 cross-version updater acceptance
on:
  push:
    branches: ['test/release690-updater-20261108']
permissions:
  contents: read
  actions: read
jobs:
  published-682-to-690:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      VELIQ_RELEASE_ACCEPTANCE: DISPOSABLE_ACTIONS_690
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - name: Actual old release to exact manually accepted candidate
        shell: powershell
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: '& ./tests/release690/acceptance.ps1'
