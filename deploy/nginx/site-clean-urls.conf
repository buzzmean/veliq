# Clean public page URLs. Include inside the HTTPS server block.
# Keep /api routing and TLS configuration in their existing includes.
location = / { try_files /index.html =404; }
location = /index.html { return 308 https://veliqapp.ru/$is_args$args; }
location = /account {
    if ($host = www.veliqapp.ru) { return 308 https://veliqapp.ru/account$is_args$args; }
    add_header Cache-Control "no-store";
    try_files /account.html =404;
}
location ~ ^/(account|how|download|clubs|pricing|support|privacy|terms|contacts|roadmap)\.html$ {
    return 308 https://veliqapp.ru/$1$is_args$args;
}
location ~ ^/(account|how|download|clubs|pricing|support|privacy|terms|contacts|roadmap)/$ {
    return 308 https://veliqapp.ru/$1$is_args$args;
}
