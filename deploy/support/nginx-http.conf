# http {} context. Include once. Allows a club sharing one public IP.
limit_req_zone $binary_remote_addr zone=veliq_support:10m rate=20r/s;
# Clear anonymous browser access at every account boundary even if support is
# unavailable. Include nginx-account-session.conf inside existing account proxy
# locations. Empty map values do not emit a header. Existing CP cookies remain.
map $uri $veliq_support_guest_expiry {
    default "";
    /api/v1/account/login/verify "__Host-veliq_support_v2=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict";
    /api/v1/account/logout "__Host-veliq_support_v2=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict";
}
