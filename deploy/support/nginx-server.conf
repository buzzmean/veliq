# HTTPS server {} on the WEBSITE host; support runs on the same host.
# Keep the existing account API proxy and TLS settings unchanged.
location = /api/v1/support { return 404; }
location ^~ /api/v1/support/ { return 410; }
# This prefix receives the path-scoped HttpOnly account cookie.
location = /api/v1/account/support { return 404; }
location ^~ /api/v1/account/support/ {
    limit_req zone=veliq_support burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_cache off;
    # No tokens or message bodies in access logs; retain aggregate nginx metrics separately.
    access_log off;
    add_header Cache-Control "no-store" always;
}
